<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Online Gratuiti</title>
    
    <!-- Kodi i Google AdSense i lidhur saktë -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1846323556153354"
         crossorigin="anonymous"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
        }
        h2 {
            color: #2c3e50;
            font-size: 20px;
            margin-bottom: 15px;
        }
        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            font-size: 14px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            resize: vertical;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            font-size: 14px;
            text-align: center;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        button:hover {
            background-color: #45a049;
        }
        .result {
            margin-top: 10px;
            font-weight: bold;
            color: #555;
        }
    </style>
</head>
<body>

    <h1>I Miei Strumenti Online</h1>

    <!-- 1. Word Counter -->
    <div class="container">
        <h2>Contatore di Parole e Caratteri</h2>
        <textarea id="textInput" placeholder="Scrivi o incolla il tuo testo qui..." oninput="countWords()"></textarea>
        <div class="result" id="wordCountResult">Parole: 0 | Caratteri: 0</div>
    </div>

    <!-- 2. Password Generator -->
    <div class="container">
        <h2>Generatore di Password Sicure</h2>
        <input type="text" id="passwordOutput" readonly placeholder="La tua password apparirà qui">
        <button onclick="generatePassword()">Genera Password</button>
    </div>

    <!-- 3. Text to Uppercase Converter -->
    <div class="container">
        <h2>Convertitore Maiuscolo / Minuscolo</h2>
        <textarea id="caseInput" placeholder="Inserisci il testo da convertire..."></textarea>
        <button onclick="convertToUppercase()">Converti in Maiuscolo</button>
    </div>

    <script>
        // Word Counter Logic
        function countWords() {
            let text = document.getElementById("textInput").value.trim();
            let words = text === "" ? 0 : text.split(/\s+/).length;
            let chars = text.length;
            document.getElementById("wordCountResult").innerText = `Parole: ${words} | Caratteri: ${chars}`;
        }

        // Password Generator Logic
        function generatePassword() {
            let chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&*!";
            let passwordLength = 12;
            let password = "";
            for (let i = 0; i < passwordLength; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById("passwordOutput").value = password;
        }

        // Uppercase Converter Logic
        function convertToUppercase() {
            let textElement = document.getElementById("caseInput");
            textElement.value = textElement.value.toUpperCase();
        }
    </script>

</body>
</html>
